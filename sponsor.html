<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsor Wall</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .sponsor-page {
      width: 100%;
      min-height: 100vh;
      padding: 26px 16px 40px;
    }

    .page-title {
      font-size: 36px;
      line-height: 1.15;
      font-weight: 800;
      color: #f59a00;
      margin-bottom: 74px;
      letter-spacing: -0.5px;
    }

    .sponsor-section {
      width: 100%;
      padding-bottom: 28px;
      margin-bottom: 32px;
      border-bottom: 2px solid #e5e7eb;
    }

    .section-title {
      font-size: 26px;
      line-height: 1.2;
      font-weight: 800;
      margin-bottom: 17px;
    }

    .title-sponsor .section-title {
      color: #f59a00;
    }

    .gold-sponsor .section-title {
      color: #3168e8;
    }

    .community-partners .section-title {
      color: #7c3aed;
    }

    .sponsor-list {
      font-size: 27px;
      line-height: 1.25;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.5px;
    }

    .sponsor-list span {
      display: inline;
    }

    @media (max-width: 700px) {
      .sponsor-page {
        padding: 22px 16px 32px;
      }

      .page-title {
        font-size: 30px;
        margin-bottom: 55px;
      }

      .section-title {
        font-size: 22px;
      }

      .sponsor-list {
        font-size: 22px;
        line-height: 1.5;
      }

      .sponsor-section {
        padding-bottom: 24px;
        margin-bottom: 26px;
      }
    }

    @media (max-width: 420px) {
      .page-title {
        font-size: 27px;
      }

      .section-title {
        font-size: 20px;
      }

      .sponsor-list {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="sponsor-page">

    <h1 class="page-title">SPONSOR WALL</h1>

    <section class="sponsor-section title-sponsor">
      <h2 class="section-title">TITLE SPONSOR</h2>

      <div class="sponsor-list">
        <span>TechCorp</span>
        <span> • </span>
        <span>Zepto</span>
      </div>
    </section>

    <section class="sponsor-section gold-sponsor">
      <h2 class="section-title">GOLD SPONSORS</h2>

      <div class="sponsor-list">
        <span>DevLabs</span>
        <span> • </span>
        <span>CloudNova</span>
        <span> • </span>
        <span>.xyz</span>
        <span> • </span>
        <span>lovable.Ai</span>
        <span> • </span>
        <span>HackNest</span>
      </div>
    </section>

    <section class="sponsor-section community-partners">
      <h2 class="section-title">COMMUNITY PARTNERS</h2>

      <div class="sponsor-list">
        <span>GitHub Community</span>
        <span> • </span>
        <span>GDG</span>
      </div>
    </section>

  </main>

</body>
</html>
